# General
dir=${HOME}/Downloads/aria2
continue=true
file-allocation=falloc
disk-cache=64M
max-concurrent-downloads=3

# HTTP and FTP
split=16
max-connection-per-server=16
min-split-size=5M
connect-timeout=10
timeout=30
max-tries=5
retry-wait=3

# BitTorrent
enable-dht=true
enable-peer-exchange=true
bt-enable-lpd=true
bt-max-peers=100
bt-request-peer-speed-limit=1M
bt-tracker-connect-timeout=10
bt-tracker-timeout=30
bt-save-metadata=true
bt-load-saved-metadata=true

# Upload and seeding
max-overall-upload-limit=0
seed-ratio=1.0

# Replace 8M with 80% of the measured upload rate
# max-overall-upload-limit=8M

# Terminal
enable-color=true
show-console-readout=true
human-readable=true
truncate-console-readout=true
console-log-level=warn
summary-interval=0
