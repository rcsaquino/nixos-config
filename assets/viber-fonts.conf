<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">

<!-- Fix Viber's fonts issue -->
<!-- https://forums.linuxmint.com/viewtopic.php?p=2664781&sid=044f9cd1740d18604101be0f89b34c8f#p2664781 -->
<!-- https://slackalaxy.com/2024/07/31/a-fonts-configuration-file-dedicated-to-a-single-program/ -->

<!--Custom fonts.conf file for Viber -->
<fontconfig>

  <!-- Load fonts configuration -->
  <include ignore_missing="yes">fonts.conf</include>

  <!-- Reject Noto Color Emoji as it has weird font spacing -->
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family" ><string>Noto Color Emoji</string></patelt></pattern>
    </rejectfont>
  </selectfont>

  <!-- Use Emoji One (fonts-emojione) -->
  <alias binding="weak"><family>monospace</family><prefer><family>Emoji One</family></prefer></alias>
  <alias binding="weak"><family>sans-serif</family><prefer><family>Emoji One</family></prefer></alias>
  <alias binding="weak"><family>serif</family><prefer><family>Emoji One</family></prefer></alias>

</fontconfig>
